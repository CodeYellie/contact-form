<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Contact form</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="contact-form">
      <h1>Contact Us</h1>
      <form>
        <div class="form-row">
          <div class="form-group">
            <label for="first-name"
              >First Name &nbsp;<span class="required">*</span></label
            >
            <input type="text" id="first-name" name="first-name" />
          </div>
          <div class="form-group">
            <label for="last-name"
              >Last Name &nbsp;<span class="required">*</span></label
            >
            <input type="text" name="last-name" id="last-name" />
          </div>
        </div>
        <div class="form-group">
          <label for="email"
            >Email Address &nbsp;<span class="required">*</span></label
          >
          <input type="email" id="email" name="email" />
        </div>
        <div class="form-group">
          <label>Query Type &nbsp;<span class="required">*</span></label>
          <div class="form-row">
            <label class="radio-option"
              ><input type="radio" name="query-type" value="general" />General
              Enquiry</label
            >
            <label class="radio-option"
              ><input type="radio" name="query-type" value="support" />Support
              Request</label
            >
          </div>
        </div>
        <div class="form-group">
          <label for="message"
            >Message &nbsp;<span class="required">*</span></label
          >
          <textarea id="message" name="message"></textarea>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" name="consent" id="consent" />
          <label for="consent"
            >I consent to being contacted by the team &nbsp;<span
              class="required"
              >*</span
            ></label
          >
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">CodeYellie</a>.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
